project_id = "poultryos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "poultryos://login-callback"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3100"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Accounts are created only by the platform after an application is approved (provision-tenant).
enable_signup = false

[auth.sms]
# CLI maps this to GOTRUE_EXTERNAL_PHONE_ENABLED (phone login on). New accounts stay blocked by [auth] enable_signup = false.
enable_signup = true
enable_confirmations = true
# Local dev only (hosted project keeps its own limit): lets e2e log the same number in back-to-back.
max_frequency = "1s"
# provider = twilio | messagebird | textlocal | vonage  (MSG91 via custom hook)

# Local only: GoTrue needs a provider configured before it accepts phone OTP.
# Test numbers below never reach Twilio.
[auth.sms.twilio]
enabled = true
account_sid = "local-dev"
message_service_sid = "local-dev"
auth_token = "local-dev"

[auth.sms.test_otp]
919849012345 = "123456"   # Venkata Krishna Reddy — VKR owner
919000033445 = "123456"   # Mallesh — VKR shed supervisor
919849022334 = "123456"   # Rajitha Reddy — VKR finance
919440012121 = "123456"   # K. Srinivasulu — KS owner
919000000000 = "123456"   # Praveen G — platform admin
919999000001 = "123456"   # e2e: new applicant (approved in onboarding.spec)
919999000002 = "123456"   # e2e: supervisor invited by that owner

[storage]
enabled = true
file_size_limit = "20MiB"

[storage.buckets.evidence]
public = false
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.documents]
public = false

[functions.sync-apply]
verify_jwt = true
[functions.ai-triage]
verify_jwt = true
[functions.market-rates]
verify_jwt = false
[functions.daily-alerts]
verify_jwt = false
[functions.razorpay-webhook]
verify_jwt = false

[functions.provision-tenant]
verify_jwt = true

[functions.invite-user]
verify_jwt = true
