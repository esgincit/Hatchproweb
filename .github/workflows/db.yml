name: Supabase migrate (manual)
# Runs only when someone clicks "Run workflow" in the Actions tab — never on push. Secrets: SUPABASE_PROJECT_REF,
# SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD (repo secrets today = the QA project; give a `production` environment its
# own copies when that project exists). See docs/QA.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment's Supabase project to migrate
        type: choice
        options: [qa, production]
        default: qa
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1  # v3 changed db push to target the local stack unless --remote
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase db push
      - run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}  # every folder in supabase/functions
